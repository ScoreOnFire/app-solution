<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &amp; FAQ — App Solution Limited</title>
<meta name="description" content="Tell us about your app idea or ask a question. We reply within a working day.">
<meta name="theme-color" content="#050B1A">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta property="og:image" content="assets/img/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-soft">
<main>
<section class="wrap page-head">
  <div class="layout-side wide-side">
    <div>
      <span class="eyebrow reveal">Contact</span>
      <h1 class="h1 reveal reveal-d1" style="margin-top:22px">Tell us about your idea</h1>
      <p class="lead reveal reveal-d2">Not ready to order? Send a message and we will come back with honest advice — even if the answer is that you do not need an app.</p>

      <form id="form" class="reveal reveal-d3" style="margin-top:34px" novalidate>
        <div class="form-grid">
          <div class="field"><label for="name">Your name</label><input class="input" id="name" required maxlength="100" autocomplete="name" placeholder="Jane Doe"></div>
          <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" required maxlength="200" autocomplete="email" placeholder="you@company.com"></div>
          <div class="field full"><label for="type">What do you need?</label>
            <select class="select" id="type"><option>A new Android app</option><option>Changes to an existing app</option><option>Play Store publishing only</option><option>Something else</option></select></div>
          <div class="field full"><label for="msg">Your message</label><textarea class="textarea" id="msg" required maxlength="3000" placeholder="Describe your idea, who it is for and roughly when you need it."></textarea></div>
          <input type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        </div>
        <p class="err" id="err" style="margin-top:14px" hidden></p>
        <button class="btn btn-primary" id="send" type="submit" style="margin-top:22px">Send message</button>
        <p class="hint" id="replyNote" style="margin-top:14px"></p>
      </form>
      <div class="notice ok" id="sent" hidden style="margin-top:30px"><span>✓</span><div><b style="color:#fff">Message sent.</b> We will reply to your email soon.</div></div>
    </div>

    <div style="perspective:1400px"><div class="float-soft">
      <div class="card reveal" style="padding:30px">
        <h2 style="font-size:17px;margin-bottom:22px">Reach us directly</h2>
        <div style="display:flex;flex-direction:column;gap:14px" id="reach"></div>
      </div>
    </div></div>
  </div>
</section>

<section class="wrap section" id="faq">
  <h2 class="h2 reveal" style="margin-bottom:30px">Common questions</h2>
  <div class="grid-2 faq" id="faqs" style="align-items:start"></div>
</section>
</main>
<script type="module" src="assets/js/main.js"></script>
<script type="module">
import { getSettings, list, esc, ensureAnon, db, collection, addDoc, serverTimestamp, toast } from "./assets/js/firebase.js";
import { ICONS, refresh } from "./assets/js/main.js";

const s = await getSettings();
document.getElementById("replyNote").textContent = `We reply within ${s.replyHours} hours.`;
const rows = [];
if (s.email) rows.push([`mailto:${s.email}`, ICONS.mail, "Email", s.email, "#FF8A1F"]);
if (s.whatsapp) rows.push([`https://wa.me/${String(s.whatsapp).replace(/\D/g, "")}`, ICONS.wa, "WhatsApp", s.whatsapp, "#7FE0AE"]);
if (s.telegram) rows.push([`https://t.me/${String(s.telegram).replace(/^@/, "")}`, ICONS.tg, "Telegram", s.telegram, "#9CC0FF"]);
if (s.facebook) rows.push([s.facebook, ICONS.fb, "Facebook", "Message us", "#9CC0FF"]);
if (s.playUrl) rows.push([s.playUrl, ICONS.play, "Google Play", s.brand, "#C8D4EA"]);
document.getElementById("reach").innerHTML = rows.map(([h, ic, l, v, c]) => `
  <a class="reach" href="${esc(h)}" ${h.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
    <span style="color:${c};width:20px;flex:0 0 auto">${ic}</span>
    <span style="min-width:0"><small>${esc(l)}</small><strong>${esc(v)}</strong></span>
  </a>`).join("");

const faqs = await list("faqs");
document.getElementById("faqs").innerHTML = faqs.map((f, i) => `<details class="reveal reveal-d${i % 2}" ${i === 0 ? "open" : ""}><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
refresh();

const form = document.getElementById("form"), err = document.getElementById("err"), btn = document.getElementById("send");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.hidden = true;
  if (document.getElementById("website").value) return; // bot trap
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("msg").value.trim();
  if (!name || !/^\S+@\S+\.\S+$/.test(email) || message.length < 10) {
    err.textContent = "Please enter your name, a valid email and a message of at least 10 characters.";
    err.hidden = false; return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending';
  try {
    const u = await ensureAnon();
    await addDoc(collection(db, "messages"), {
      uid: u.uid, name, email, message, type: document.getElementById("type").value,
      read: false, createdAt: serverTimestamp()
    });
    form.hidden = true; document.getElementById("sent").hidden = false;
    toast("Message sent");
  } catch (x) {
    console.error(x);
    err.textContent = "Could not send right now. Please email us directly instead.";
    err.hidden = false;
  } finally { btn.disabled = false; btn.textContent = "Send message"; }
});
</script>
</body>
</html>
