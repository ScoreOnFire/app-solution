<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — App Solution Limited</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050B1A">
<link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
body{background:#040916}
.adm{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:#060D20;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.side .brand{margin:0 8px 22px;font-size:16px}
.side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:12px;border:0;background:transparent;color:var(--soft);font-size:14.5px;font-weight:600;cursor:pointer}
.side button:hover{background:rgba(255,255,255,.05);color:#fff}
.side button.on{background:var(--accent-soft);color:var(--accent2)}
.side .cnt{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.content{padding:30px 34px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:26px}
.top h1{font-size:28px}
.top .r{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl-box{border:1px solid var(--line);border-radius:18px;overflow:auto;background:var(--panel)}
.tbl th{text-align:left;padding:13px 16px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:rgba(255,255,255,.03)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:26px}
.kpi{padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--dim)}
dialog{border:1px solid var(--line2);border-radius:24px;background:#0A142C;color:#fff;padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100vh - 40px);box-shadow:0 40px 100px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(2,6,16,.75);backdrop-filter:blur(4px)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0A142C;z-index:2}
.dlg-h h2{font-size:19px}
.dlg-b{padding:22px 24px}
.dlg-f{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#0A142C}
.x{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:#fff;font-size:20px;cursor:pointer}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;font-size:14.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;word-break:break-word}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:54px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:min(440px,100%);padding:34px}
.btn-danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4);color:#FFB1B1}
.btn-danger:hover{color:#fff;background:rgba(255,107,107,.25)}
.mob-top{display:none}
@media (max-width:900px){
  .adm{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;z-index:60;transform:translateX(-102%);transition:.3s;height:100vh}
  body.side-open .side{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.6)}
  .mob-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#040916;z-index:40}
  .content{padding:22px 16px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:8px}
}
</style>
</head>
<body data-no-chrome="1">
<div id="app"><div class="login"><div class="ld" style="font-family:var(--mono);color:var(--accent2)">loading admin…</div></div></div>
<dialog id="dlg"></dialog>
<script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
